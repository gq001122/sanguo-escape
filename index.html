<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三国逃亡 - 神庙跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 9/16;
            max-height: 100vh;
            overflow: hidden;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* 开始界面 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 30%, #228B22 60%, #1a5a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .title {
            font-size: 2.5em;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 1em;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        
        .character-select {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .char-btn {
            width: 90px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .char-btn:hover, .char-btn.selected {
            border-color: #FFD700;
            background: rgba(255,215,0,0.3);
            transform: scale(1.05);
        }
        
        .char-icon {
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        
        .char-name {
            color: #fff;
            font-size: 0.9em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .char-skill {
            color: rgba(255,255,255,0.8);
            font-size: 0.7em;
            margin-top: 3px;
        }
        
        .start-btn {
            background: linear-gradient(180deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            padding: 15px 60px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255,165,0,0.5);
        }
        
        .start-btn:active {
            transform: scale(0.95);
        }
        
        /* 游戏结束界面 */
        #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .gameover-title {
            font-size: 2em;
            color: #FF4444;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .score-display {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .score-label {
            color: rgba(255,255,255,0.7);
            font-size: 1em;
            margin-bottom: 30px;
        }
        
        .best-score {
            color: rgba(255,255,255,0.5);
            font-size: 0.9em;
            margin-bottom: 40px;
        }
        
        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: none;
            justify-content: space-between;
            z-index: 5;
        }
        
        .hud-item {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.9em;
            backdrop-filter: blur(5px);
        }
        
        /* 分叉选择界面 */
        #choice-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .choice-title {
            font-size: 1.5em;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .choice-buttons {
            display: flex;
            gap: 20px;
        }
        
        .choice-btn {
            background: linear-gradient(180deg, rgba(255,215,0,0.8), rgba(255,165,0,0.8));
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 120px;
        }
        
        .choice-icon {
            font-size: 2em;
        }
        
        .choice-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 开始界面 -->
        <div id="start-screen">
            <h1 class="title">🏯 三国逃亡</h1>
            <p class="subtitle">慢节奏跑酷 · 欣赏三国风光</p>
            
            <div class="character-select">
                <div class="char-btn selected" data-char="liubei">
                    <span class="char-icon">👑</span>
                    <span class="char-name">刘备</span>
                    <span class="char-skill">双倍金币</span>
                </div>
                <div class="char-btn" data-char="guanyu">
                    <span class="char-icon">⚔️</span>
                    <span class="char-name">关羽</span>
                    <span class="char-skill">跳跃强化</span>
                </div>
                <div class="char-btn" data-char="zhangfei">
                    <span class="char-icon">🗡️</span>
                    <span class="char-name">张飞</span>
                    <span class="char-skill">滑铲强化</span>
                </div>
            </div>
            
            <button class="start-btn" id="startBtn">开始逃亡</button>
        </div>
        
        <!-- 游戏结束界面 -->
        <div id="gameover-screen">
            <h2 class="gameover-title">💀 逃亡结束</h2>
            <div class="score-display" id="finalScore">0</div>
            <div class="score-label">米</div>
            <div class="best-score" id="bestScore">最高纪录: 0米</div>
            <button class="start-btn" id="restartBtn">再来一次</button>
        </div>
        
        <!-- 分叉选择界面 -->
        <div id="choice-screen">
            <div class="choice-title">🏔️ 选择前路</div>
            <div class="choice-buttons" id="choiceButtons"></div>
        </div>
        
        <!-- HUD -->
        <div id="hud">
            <div class="hud-item score-hud" id="scoreHud">🏃 0米</div>
            <div class="hud-item coin-hud" id="coinHud">🪙 0</div>
        </div>
    </div>

    <script>
        // 游戏常量
        const JUMP_DURATION = 600;
        const SLIDE_DURATION = 500;
        
        // 游戏状态
        let game = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            running: false,
            paused: false,
            score: 0,
            coins: 0,
            bestScore: parseInt(localStorage.getItem('sanguoEscape_best')) || 0,
            speed: 3,  // 降低初始速度
            maxSpeed: 8,  // 降低最高速度
            character: 'liubei',
            player: {
                x: 0,
                y: 0,
                width: 60,
                height: 100,
                jumping: false,
                sliding: false,
                jumpStart: 0,
                slideStart: 0,
                frame: 0
            },
            obstacles: [],
            coinItems: [],
            decorations: [],
            sceneType: 'bamboo',  // bamboo, mountain, ancient, forest
            scenes: ['bamboo', 'mountain', 'ancient', 'forest'],
            sceneChangeDistance: 800,  // 每800米换场景
            lastSceneDistance: 0,
            lastObstacleTime: 0,
            lastCoinTime: 0,
            lastDecorationTime: 0,
            lastChoiceDistance: 0,
            nextChoiceDistance: 500,  // 每500米出现分叉
            touchStartX: 0,
            touchStartY: 0
        };
        
        // 角色属性
        const characters = {
            liubei: { name: '刘备', icon: '👑', color: '#4169E1' },
            guanyu: { name: '关羽', icon: '⚔️', color: '#228B22' },
            zhangfei: { name: '张飞', icon: '🗡️', color: '#8B0000' }
        };
        
        // 场景装饰配置
        const sceneDecorations = {
            bamboo: {
                bg: ['#87CEEB', '#98D8AA', '#228B22', '#1a5a1a'],
                ground: '#8B7355',
                decorations: ['🎋', '🎍', '🌿', '🍃'],
                groundDecor: ['🌸', '🍂', '小草']
            },
            mountain: {
                bg: ['#C9A66B', '#DEB887', '#8B7355', '#654321'],
                ground: '#6B5344',
                decorations: ['⛰️', '🌄', '🗻', '🏔️'],
                groundDecor: ['🌺', '🌻', '小草']
            },
            ancient: {
                bg: ['#8B7355', '#A0522D', '#6B4423', '#4a3015'],
                ground: '#5C4033',
                decorations: ['🏯', '🛕', '🏮', '⛩️'],
                groundDecor: ['🌺', '🍁', '石子']
            },
            forest: {
                bg: ['#228B22', '#32CD32', '#228B22', '#1a4a1a'],
                ground: '#654321',
                decorations: ['🌲', '🌳', '🍄', '🦋'],
                groundDecor: ['🌸', '🍃', '小草']
            }
        };
        
        // 障碍物类型
        const obstacleTypes = [
            { type: 'log', emoji: '🪵', width: 80, height: 40 },
            { type: 'rock', emoji: '🪨', width: 60, height: 50 },
            { type: 'hole', emoji: '🕳️', width: 70, height: 30 }
        ];
        
        // 分叉选择
        const forkChoices = [
            [
                { icon: '⬅️', label: '左转', desc: '山间小路' },
                { icon: '➡️', label: '右转', desc: '林间小道' }
            ],
            [
                { icon: '⬆️', label: '上行', desc: '山顶古道' },
                { icon: '⬇️', label: '下行', desc: '溪涧小路' }
            ],
            [
                { icon: '🏔️', label: '山路', desc: '蜿蜒曲折' },
                { icon: '🌲', label: '林路', desc: '幽静清凉' }
            ],
            [
                { icon: '👈', label: '左道', desc: '竹林深处' },
                { icon: '👉', label: '右道', desc: '古树参天' }
            ]
        ];
        
        // 初始化
        function init() {
            game.canvas = document.getElementById('gameCanvas');
            game.ctx = game.canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 触摸事件
            game.canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            game.canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            game.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // 鼠标事件（PC测试）
            game.canvas.addEventListener('mousedown', handleMouseDown);
            game.canvas.addEventListener('mouseup', handleMouseUp);
            
            // 键盘事件（PC测试）
            document.addEventListener('keydown', handleKeyDown);
            
            // 角色选择
            document.querySelectorAll('.char-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    game.character = btn.dataset.char;
                });
            });
            
            // 按钮
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            
            document.getElementById('bestScore').textContent = `最高纪录: ${game.bestScore}米`;
        }
        
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const rect = container.getBoundingClientRect();
            game.canvas.width = rect.width * window.devicePixelRatio;
            game.canvas.height = rect.height * window.devicePixelRatio;
            game.width = rect.width;
            game.height = rect.height;
            game.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            game.player.y = game.height * 0.7;
            game.player.x = game.width * 0.3;  // 角色在画面左侧1/3处
        }
        
        // 触摸处理
        function handleTouchStart(e) {
            e.preventDefault();
            if (!game.running || game.paused) return;
            const touch = e.touches[0];
            game.touchStartX = touch.clientX;
            game.touchStartY = touch.clientY;
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            if (!game.running || game.paused) return;
            
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - game.touchStartX;
            const deltaY = touch.clientY - game.touchStartY;
            
            handleSwipe(deltaX, deltaY);
        }
        
        // 鼠标处理
        let mouseDown = false;
        let mouseStartX = 0;
        let mouseStartY = 0;
        
        function handleMouseDown(e) {
            if (!game.running || game.paused) return;
            mouseDown = true;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
        }
        
        function handleMouseUp(e) {
            if (!game.running || game.paused || !mouseDown) return;
            mouseDown = false;
            const deltaX = e.clientX - mouseStartX;
            const deltaY = e.clientY - mouseStartY;
            handleSwipe(deltaX, deltaY);
        }
        
        // 键盘处理
        function handleKeyDown(e) {
            if (!game.running || game.paused) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                case ' ':
                    jump();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    slide();
                    break;
            }
        }
        
        // 手势识别（简化：只支持上下）
        function handleSwipe(deltaX, deltaY) {
            const threshold = 30;
            
            if (deltaY < -threshold) {
                jump();
            } else if (deltaY > threshold) {
                slide();
            }
        }
        
        function jump() {
            if (!game.player.jumping && !game.player.sliding) {
                game.player.jumping = true;
                game.player.jumpStart = Date.now();
                setTimeout(() => {
                    game.player.jumping = false;
                }, JUMP_DURATION);
            }
        }
        
        function slide() {
            if (!game.player.jumping && !game.player.sliding) {
                game.player.sliding = true;
                game.player.slideStart = Date.now();
                setTimeout(() => {
                    game.player.sliding = false;
                }, SLIDE_DURATION);
            }
        }
        
        // 开始游戏
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('choice-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            
            game.running = true;
            game.paused = false;
            game.score = 0;
            game.coins = 0;
            game.speed = 3;
            game.player.jumping = false;
            game.player.sliding = false;
            game.obstacles = [];
            game.coinItems = [];
            game.decorations = [];
            game.sceneType = 'bamboo';
            game.lastSceneDistance = 0;
            game.lastChoiceDistance = 0;
            game.nextChoiceDistance = 500;
            game.lastObstacleTime = Date.now();
            game.lastCoinTime = Date.now();
            game.lastDecorationTime = Date.now();
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }
        
        // 游戏循环
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!game.running) return;
            
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            if (!game.paused) {
                update(deltaTime);
            }
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 更新游戏逻辑
        function update(deltaTime) {
            // 增加分数
            game.score += game.speed * 0.3;
            
            // 缓慢增加速度
            if (game.speed < game.maxSpeed) {
                game.speed += 0.001;
            }
            
            // 场景切换
            if (game.score - game.lastSceneDistance > game.sceneChangeDistance) {
                game.lastSceneDistance = game.score;
                game.sceneType = game.scenes[Math.floor(Math.random() * game.scenes.length)];
            }
            
            // 检查分叉选择
            if (game.score - game.lastChoiceDistance > game.nextChoiceDistance) {
                showChoiceScreen();
                return;
            }
            
            // 生成障碍物
            const now = Date.now();
            const obstacleInterval = Math.max(1500, 3000 - game.speed * 100);
            
            if (now - game.lastObstacleTime > obstacleInterval) {
                spawnObstacle();
                game.lastObstacleTime = now;
            }
            
            // 生成金币
            const coinInterval = 800;
            if (now - game.lastCoinTime > coinInterval) {
                spawnCoin();
                game.lastCoinTime = now;
            }
            
            // 生成装饰
            const decorInterval = 200;
            if (now - game.lastDecorationTime > decorInterval) {
                spawnDecoration();
                game.lastDecorationTime = now;
            }
            
            // 更新装饰（模拟透视移动）
            game.decorations = game.decorations.filter(dec => {
                dec.y += game.speed * 3;
                dec.scale = 0.3 + (dec.y / game.height) * 0.7;
                dec.opacity = 0.3 + (dec.y / game.height) * 0.5;
                return dec.y < game.height + 100;
            });
            
            // 更新障碍物
            game.obstacles = game.obstacles.filter(obs => {
                obs.y += game.speed * 3;
                
                // 碰撞检测
                const playerBottom = game.player.y;
                const playerTop = game.player.y - game.player.height;
                const playerRight = game.player.x + game.player.width * 0.4;
                const playerLeft = game.player.x - game.player.width * 0.4;
                
                if (obs.y + obs.height > playerTop && obs.y < playerBottom) {
                    if (obs.x + obs.width > playerLeft && obs.x - obs.width < playerRight) {
                        // 撞到障碍
                        if (obs.type === 'hole') {
                            if (!game.player.sliding) {
                                gameOver();
                                return false;
                            }
                        } else {
                            if (!game.player.jumping) {
                                gameOver();
                                return false;
                            }
                        }
                    }
                }
                
                return obs.y < game.height + 100;
            });
            
            // 更新金币
            game.coinItems = game.coinItems.filter(coin => {
                coin.y += game.speed * 3;
                coin.rotation += 0.1;
                
                // 碰撞检测
                const dist = Math.sqrt(
                    Math.pow(coin.x - game.player.x, 2) + 
                    Math.pow(coin.y - game.player.y + game.player.height/2, 2)
                );
                
                if (dist < coin.size + 40) {
                    game.coins += 2;  // 双倍金币
                    updateHUD();
                    return false;
                }
                
                return coin.y < game.height + 50;
            });
            
            // 更新角色帧
            game.player.frame = (game.player.frame + 0.15) % 4;
            
            updateHUD();
        }
        
        // 显示分叉选择
        function showChoiceScreen() {
            game.paused = true;
            game.lastChoiceDistance = game.score;
            game.nextChoiceDistance = 500 + Math.random() * 300;  // 500-800米后再次分叉
            
            const choices = forkChoices[Math.floor(Math.random() * forkChoices.length)];
            const buttons = document.getElementById('choiceButtons');
            buttons.innerHTML = '';
            
            choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `
                    <span class="choice-icon">${choice.icon}</span>
                    <span>${choice.label}</span>
                    <span style="font-size:0.7em;opacity:0.7">${choice.desc}</span>
                `;
                btn.onclick = () => {
                    document.getElementById('choice-screen').style.display = 'none';
                    game.paused = false;
                };
                buttons.appendChild(btn);
            });
            
            document.getElementById('choice-screen').style.display = 'flex';
        }
        
        // 生成障碍物
        function spawnObstacle() {
            const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            const laneX = game.width * (0.3 + Math.random() * 0.5);  // 障碍物在画面中右侧
            
            game.obstacles.push({
                x: laneX,
                y: -100,
                ...type
            });
        }
        
        // 生成金币
        function spawnCoin() {
            const laneX = game.width * (0.3 + Math.random() * 0.5);
            
            game.coinItems.push({
                x: laneX,
                y: -50,
                size: 35,
                rotation: 0
            });
        }
        
        // 生成装饰
        function spawnDecoration() {
            const config = sceneDecorations[game.sceneType];
            const decor = config.decorations[Math.floor(Math.random() * config.decorations.length)];
            const side = Math.random() > 0.5 ? 'left' : 'right';
            
            game.decorations.push({
                emoji: decor,
                x: side === 'left' ? Math.random() * game.width * 0.25 : game.width * 0.75 + Math.random() * game.width * 0.25,
                y: -50,
                scale: 0.3,
                opacity: 0.5,
                side: side
            });
        }
        
        // 游戏结束
        function gameOver() {
            game.running = false;
            
            if (game.score > game.bestScore) {
                game.bestScore = Math.floor(game.score);
                localStorage.setItem('sanguoEscape_best', game.bestScore);
            }
            
            document.getElementById('finalScore').textContent = Math.floor(game.score);
            document.getElementById('bestScore').textContent = `最高纪录: ${game.bestScore}米`;
            document.getElementById('gameover-screen').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
        }
        
        // 更新HUD
        function updateHUD() {
            document.getElementById('scoreHud').textContent = `🏃 ${Math.floor(game.score)}米`;
            document.getElementById('coinHud').textContent = `🪙 ${game.coins}`;
        }
        
        // 渲染
        function render() {
            const ctx = game.ctx;
            const w = game.width;
            const h = game.height;
            const config = sceneDecorations[game.sceneType];
            
            // 绘制天空渐变背景
            const skyGradient = ctx.createLinearGradient(0, 0, 0, h * 0.6);
            const bgColors = config.bg;
            skyGradient.addColorStop(0, bgColors[0]);
            skyGradient.addColorStop(0.5, bgColors[1]);
            skyGradient.addColorStop(1, bgColors[2]);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, w, h);
            
            // 绘制地面
            const groundY = h * 0.75;
            ctx.fillStyle = config.ground;
            ctx.fillRect(0, groundY, w, h - groundY);
            
            // 绘制道路（透视效果）
            drawRoad(ctx, w, h, groundY);
            
            // 绘制装饰（背景）
            game.decorations.filter(d => d.y > h * 0.3).forEach(dec => {
                drawDecoration(ctx, dec);
            });
            
            // 绘制金币
            game.coinItems.forEach(coin => {
                drawCoin(ctx, coin);
            });
            
            // 绘制障碍物
            game.obstacles.forEach(obs => {
                drawObstacle(ctx, obs);
            });
            
            // 绘制玩家（第三视角，背对屏幕）
            drawPlayer(ctx);
            
            // 绘制装饰（前景）
            game.decorations.filter(d => d.y > h * 0.6).forEach(dec => {
                drawDecoration(ctx, dec);
            });
        }
        
        // 绘制道路（透视效果）
        function drawRoad(ctx, w, h, groundY) {
            const vanishY = h * 0.35;  // 消失点
            const roadWidthTop = 20;
            const roadWidthBottom = w * 0.8;
            
            // 道路渐变
            const roadGradient = ctx.createLinearGradient(0, vanishY, 0, h);
            roadGradient.addColorStop(0, 'rgba(139, 119, 85, 0.3)');
            roadGradient.addColorStop(1, 'rgba(139, 119, 85, 1)');
            
            ctx.fillStyle = roadGradient;
            ctx.beginPath();
            ctx.moveTo(w/2 - roadWidthTop/2, vanishY);
            ctx.lineTo(w/2 + roadWidthTop/2, vanishY);
            ctx.lineTo(w/2 + roadWidthBottom/2, h);
            ctx.lineTo(w/2 - roadWidthBottom/2, h);
            ctx.closePath();
            ctx.fill();
            
            // 道路边线
            ctx.strokeStyle = 'rgba(100, 80, 60, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(w/2 - roadWidthTop/2, vanishY);
            ctx.lineTo(w/2 - roadWidthBottom/2, h);
            ctx.moveTo(w/2 + roadWidthTop/2, vanishY);
            ctx.lineTo(w/2 + roadWidthBottom/2, h);
            ctx.stroke();
            
            // 绘制移动的道路线（透视效果）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            const lineOffset = (Date.now() * game.speed * 0.5) % 50;
            
            for (let i = 0; i < 15; i++) {
                const t = (i * 50 + lineOffset) / (h - vanishY);
                if (t > 0 && t < 1) {
                    const y = vanishY + t * (h - vanishY);
                    const roadWidth = roadWidthTop + (roadWidthBottom - roadWidthTop) * t;
                    ctx.beginPath();
                    ctx.moveTo(w/2 - roadWidth/2, y);
                    ctx.lineTo(w/2 + roadWidth/2, y);
                    ctx.stroke();
                }
            }
        }
        
        // 绘制装饰
        function drawDecoration(ctx, dec) {
            ctx.save();
            ctx.globalAlpha = dec.opacity;
            ctx.font = `${40 * dec.scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(dec.emoji, dec.x, dec.y);
            ctx.restore();
        }
        
        // 绘制玩家（第三视角）
        function drawPlayer(ctx) {
            const p = game.player;
            const char = characters[game.character];
            
            ctx.save();
            ctx.translate(p.x, p.y);
            
            // 跳跃效果
            let jumpOffset = 0;
            if (p.jumping) {
                const elapsed = Date.now() - p.jumpStart;
                const progress = elapsed / JUMP_DURATION;
                jumpOffset = -Math.sin(progress * Math.PI) * 40;
            }
            
            // 滑铲效果
            let scaleX = 1, scaleY = 1;
            if (p.sliding) {
                scaleX = 1.3;
                scaleY = 0.5;
            }
            
            ctx.scale(scaleX, scaleY);
            
            // 绘制阴影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 5, 25, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 绘制角色（背对屏幕，头略向左看）
            ctx.font = `${p.height}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char.icon, 0, jumpOffset - 20);
            
            // 奔跑动画效果
            const bobY = Math.sin(p.frame * Math.PI) * 3;
            ctx.font = `${p.height * 0.3}px Arial`;
            ctx.fillText('💨', -15, jumpOffset + 10 + bobY);
            ctx.fillText('💨', 15, jumpOffset + 15 - bobY);
            
            ctx.restore();
        }
        
        // 绘制障碍物
        function drawObstacle(ctx, obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            
            // 透视缩放（远处小，近处大）
            const scale = 0.5 + (obs.y / game.height) * 0.5;
            
            ctx.font = `${obs.height * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(obs.emoji, 0, 0);
            
            ctx.restore();
        }
        
        // 绘制金币
        function drawCoin(ctx, coin) {
            ctx.save();
            ctx.translate(coin.x, coin.y);
            
            // 透视缩放
            const scale = 0.5 + (coin.y / game.height) * 0.5;
            ctx.rotate(coin.rotation);
            
            ctx.font = `${coin.size * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🪙', 0, 0);
            
            // 光晕效果
            ctx.globalAlpha = 0.3;
            ctx.font = `${coin.size * scale * 1.5}px Arial`;
            ctx.fillText('✨', 0, 0);
            
            ctx.restore();
        }
        
        // 启动
        init();
    </script>
</body>

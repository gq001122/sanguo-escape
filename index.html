<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三国逃亡 - 3D神庙跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 9/16;
            max-height: 100vh;
            overflow: hidden;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* 开始界面 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/bg_game_0.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #start-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        
        .title {
            font-size: 2.8em;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8), 0 0 20px rgba(255,215,0,0.3);
            margin-bottom: 10px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .subtitle {
            font-size: 1em;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }
        
        .character-select {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        
        .char-btn {
            width: 85px;
            height: 110px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .char-btn:hover, .char-btn.selected {
            border-color: #FFD700;
            background: rgba(255,215,0,0.3);
            transform: scale(1.05);
        }
        
        .char-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 5px;
            object-fit: cover;
        }
        
        .char-name {
            color: #fff;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .char-skill {
            color: rgba(255,255,255,0.7);
            font-size: 0.65em;
            margin-top: 3px;
        }
        
        .start-btn {
            background: linear-gradient(180deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            padding: 15px 60px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255,165,0,0.5);
            position: relative;
            z-index: 1;
        }
        
        .start-btn:active {
            transform: scale(0.95);
        }
        
        .guide {
            color: rgba(255,255,255,0.7);
            font-size: 0.85em;
            margin-top: 30px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        /* 游戏结束界面 */
        #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .gameover-title {
            font-size: 2em;
            color: #FF4444;
            margin-bottom: 20px;
        }
        
        .score-display {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .score-label {
            color: rgba(255,255,255,0.7);
            font-size: 1em;
            margin-bottom: 30px;
        }
        
        .best-score {
            color: rgba(255,255,255,0.5);
            font-size: 0.9em;
            margin-bottom: 40px;
        }
        
        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: none;
            justify-content: space-between;
            z-index: 5;
        }
        
        .hud-item {
            background: rgba(0,0,0,0.6);
            padding: 10px 18px;
            border-radius: 25px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            border: 2px solid rgba(255,215,0,0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 开始界面 -->
        <div id="start-screen">
            <h1 class="title">🏯 三国逃亡</h1>
            <p class="subtitle">3D神庙跑酷 · 三国篇</p>
            
            <div class="character-select">
                <div class="char-btn selected" data-char="liubei" data-img="player_0">
                    <img class="char-icon" src="images/player_0.jpg">
                    <span class="char-name">刘备</span>
                    <span class="char-skill">双倍金币</span>
                </div>
                <div class="char-btn" data-char="guanyu" data-img="player_1">
                    <img class="char-icon" src="images/player_1.jpg">
                    <span class="char-name">关羽</span>
                    <span class="char-skill">跳跃强化</span>
                </div>
                <div class="char-btn" data-char="zhangfei" data-img="player_2">
                    <img class="char-icon" src="images/player_2.jpg">
                    <span class="char-name">张飞</span>
                    <span class="char-skill">滑铲强化</span>
                </div>
            </div>
            
            <button class="start-btn" id="startBtn">开始逃亡</button>
            
            <div class="guide">
                <p>上滑跳跃 · 下滑滑铲</p>
                <p style="margin-top:5px;font-size:0.8em;opacity:0.7">自动跟随道路拐弯</p>
            </div>
        </div>
        
        <!-- 游戏结束界面 -->
        <div id="gameover-screen">
            <h2 class="gameover-title">💀 逃亡结束</h2>
            <div class="score-display" id="finalScore">0</div>
            <div class="score-label">米</div>
            <div class="best-score" id="bestScore">最高纪录: 0米</div>
            <button class="start-btn" id="restartBtn">再来一次</button>
        </div>
        
        <!-- HUD -->
        <div id="hud">
            <div class="hud-item score-hud" id="scoreHud">🏃 0米</div>
            <div class="hud-item coin-hud" id="coinHud">🪙 0</div>
        </div>
    </div>

    <script>
        // 游戏常量
        const JUMP_DURATION = 500;
        const SLIDE_DURATION = 400;
        const ROAD_SEGMENT_LENGTH = 200;
        const ROAD_WIDTH = 400;
        const LANE_COUNT = 3;
        
        // 游戏状态
        let game = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            running: false,
            score: 0,
            coins: 0,
            bestScore: parseInt(localStorage.getItem('sanguo3d_best')) || 0,
            speed: 5,
            maxSpeed: 15,
            character: 'liubei',
            characterImg: null,
            player: {
                lane: 1,
                jumping: false,
                sliding: false,
                jumpStart: 0,
                slideStart: 0,
                z: 0
            },
            roadSegments: [],
            obstacles: [],
            coinItems: [],
            decorations: [],
            currentSegmentIndex: 0,
            playerZ: 0,
            cameraOffset: { x: 0, angle: 0 },
            bgImages: [],
            decorationImages: [],
            coinImage: null,
            obstacleImage: null,
            roadImage: null,
            touchStartX: 0,
            touchStartY: 0,
            assetsLoaded: false,
            assetsToLoad: 0,
            assetsLoadedCount: 0
        };
        
        // 角色属性
        const characters = {
            liubei: { name: '刘备', color: '#4169E1' },
            guanyu: { name: '关羽', color: '#228B22' },
            zhangfei: { name: '张飞', color: '#8B0000' }
        };
        
        // 道路段类型
        const segmentTypes = [
            { type: 'straight', turn: 0 },
            { type: 'straight', turn: 0 },
            { type: 'left', turn: -15 },
            { type: 'right', turn: 15 },
            { type: 'gentle_left', turn: -8 },
            { type: 'gentle_right', turn: 8 }
        ];
        
        // 障碍物类型
        const obstacleTypes = [
            { type: 'rock' },
            { type: 'log' },
            { type: 'hole' }
        ];
        
        // 加载图片
        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }
        
        // 初始化
        async function init() {
            game.canvas = document.getElementById('gameCanvas');
            game.ctx = game.canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 预加载图片资源
            await loadAssets();
            
            // 触摸事件
            game.canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            game.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // 鼠标事件（PC测试）
            game.canvas.addEventListener('mousedown', handleMouseDown);
            game.canvas.addEventListener('mouseup', handleMouseUp);
            
            // 键盘事件
            document.addEventListener('keydown', handleKeyDown);
            
            // 角色选择
            document.querySelectorAll('.char-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    game.character = btn.dataset.char;
                    game.characterImg = game.playerImages[btn.dataset.img] || game.playerImages['player_0'];
                });
            });
            
            // 按钮
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            
            document.getElementById('bestScore').textContent = `最高纪录: ${game.bestScore}米`;
        }
        
        // 加载游戏资源
        async function loadAssets() {
            // 加载背景图
            for (let i = 0; i < 4; i++) {
                const img = await loadImage(`images/bg_game_${i}.jpg`);
                if (img) game.bgImages.push(img);
            }
            
            // 加载角色图
            game.playerImages = {};
            for (let i = 0; i < 3; i++) {
                const img = await loadImage(`images/player_${i}.jpg`);
                if (img) game.playerImages[`player_${i}`] = img;
            }
            game.characterImg = game.playerImages['player_0'];
            
            // 加载装饰图
            for (let i = 0; i < 3; i++) {
                const img = await loadImage(`images/decoration_${i}.jpg`);
                if (img) game.decorationImages.push(img);
            }
            
            // 加载金币图
            game.coinImage = await loadImage('images/coin_0.jpg');
            
            // 加载障碍图
            game.obstacleImage = await loadImage('images/obstacle_0.jpg');
            
            // 加载道路图
            game.roadImage = await loadImage('images/road_0.jpg');
            
            game.assetsLoaded = true;
        }
        
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const rect = container.getBoundingClientRect();
            game.canvas.width = rect.width * window.devicePixelRatio;
            game.canvas.height = rect.height * window.devicePixelRatio;
            game.width = rect.width;
            game.height = rect.height;
            game.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        
        // 触摸处理
        function handleTouchStart(e) {
            e.preventDefault();
            if (!game.running) return;
            const touch = e.touches[0];
            game.touchStartX = touch.clientX;
            game.touchStartY = touch.clientY;
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            if (!game.running) return;
            
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - game.touchStartX;
            const deltaY = touch.clientY - game.touchStartY;
            
            handleSwipe(deltaX, deltaY);
        }
        
        // 鼠标处理
        let mouseDown = false;
        let mouseStartX = 0;
        let mouseStartY = 0;
        
        function handleMouseDown(e) {
            if (!game.running) return;
            mouseDown = true;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
        }
        
        function handleMouseUp(e) {
            if (!game.running || !mouseDown) return;
            mouseDown = false;
            const deltaX = e.clientX - mouseStartX;
            const deltaY = e.clientY - mouseStartY;
            handleSwipe(deltaX, deltaY);
        }
        
        // 键盘处理
        function handleKeyDown(e) {
            if (!game.running) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                case ' ':
                    jump();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    slide();
                    break;
            }
        }
        
        // 手势识别
        function handleSwipe(deltaX, deltaY) {
            const threshold = 30;
            
            if (Math.abs(deltaY) > Math.abs(deltaX)) {
                if (deltaY < -threshold) jump();
                else if (deltaY > threshold) slide();
            }
        }
        
        function jump() {
            if (!game.player.jumping && !game.player.sliding) {
                game.player.jumping = true;
                game.player.jumpStart = Date.now();
                setTimeout(() => {
                    game.player.jumping = false;
                }, JUMP_DURATION);
            }
        }
        
        function slide() {
            if (!game.player.jumping && !game.player.sliding) {
                game.player.sliding = true;
                game.player.slideStart = Date.now();
                setTimeout(() => {
                    game.player.sliding = false;
                }, SLIDE_DURATION);
            }
        }
        
        // 开始游戏
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            
            game.running = true;
            game.score = 0;
            game.coins = 0;
            game.speed = 5;
            game.player.lane = 1;
            game.player.jumping = false;
            game.player.sliding = false;
            game.playerZ = 0;
            game.currentSegmentIndex = 0;
            game.cameraOffset = { x: 0, angle: 0 };
            game.roadSegments = [];
            game.obstacles = [];
            game.coinItems = [];
            game.decorations = [];
            
            // 初始化道路
            for (let i = 0; i < 30; i++) {
                addRoadSegment();
            }
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }
        
        // 添加道路段
        function addRoadSegment() {
            let segment;
            
            if (game.roadSegments.length < 3) {
                segment = { type: 'straight', turn: 0 };
            } else {
                segment = segmentTypes[Math.floor(Math.random() * segmentTypes.length)];
            }
            
            const lastSeg = game.roadSegments[game.roadSegments.length - 1];
            if (lastSeg) {
                segment.angle = lastSeg.angle + segment.turn;
            } else {
                segment.angle = 0;
            }
            
            segment.z = game.roadSegments.length * ROAD_SEGMENT_LENGTH;
            game.roadSegments.push(segment);
        }
        
        // 游戏循环
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!game.running) return;
            
            update();
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 更新游戏
        function update() {
            // 移动玩家
            game.playerZ += game.speed;
            game.score = Math.floor(game.playerZ / 10);
            
            // 缓慢加速
            if (game.speed < game.maxSpeed) {
                game.speed += 0.002;
            }
            
            // 更新相机角度（跟随道路拐弯）
            const currentSeg = getSegmentAtZ(game.playerZ);
            if (currentSeg) {
                const targetAngle = currentSeg.angle * 0.3;
                game.cameraOffset.angle += (targetAngle - game.cameraOffset.angle) * 0.05;
            }
            
            // 更新道路
            while (game.roadSegments.length > 0 && game.roadSegments[0].z < game.playerZ - 500) {
                game.roadSegments.shift();
                game.currentSegmentIndex--;
                addRoadSegment();
            }
            
            // 生成障碍物
            if (Math.random() < 0.02) {
                spawnObstacle();
            }
            
            // 生成金币
            if (Math.random() < 0.05) {
                spawnCoin();
            }
            
            // 生成装饰
            if (Math.random() < 0.08) {
                spawnDecoration();
            }
            
            // 更新障碍物
            game.obstacles = game.obstacles.filter(obs => {
                obs.z -= game.speed;
                
                if (obs.z < game.playerZ + 50 && obs.z > game.playerZ - 30) {
                    if (obs.lane === game.player.lane) {
                        if (obs.jumpable && game.player.jumping) {
                            // 跳过
                        } else if (obs.slideable && game.player.sliding) {
                            // 滑过
                        } else {
                            gameOver();
                            return false;
                        }
                    }
                }
                
                return obs.z > game.playerZ - 100;
            });
            
            // 更新金币
            game.coinItems = game.coinItems.filter(coin => {
                coin.z -= game.speed;
                
                if (coin.z < game.playerZ + 50 && coin.z > game.playerZ - 30) {
                    if (coin.lane === game.player.lane) {
                        game.coins += 2;
                        updateHUD();
                        return false;
                    }
                }
                
                return coin.z > game.playerZ - 100;
            });
            
            // 更新装饰
            game.decorations = game.decorations.filter(dec => {
                dec.z -= game.speed;
                return dec.z > game.playerZ - 200;
            });
            
            updateHUD();
        }
        
        // 获取指定位置的路面段
        function getSegmentAtZ(z) {
            for (let i = game.roadSegments.length - 1; i >= 0; i--) {
                const seg = game.roadSegments[i];
                if (z >= seg.z - ROAD_SEGMENT_LENGTH && z < seg.z) {
                    return seg;
                }
            }
            return game.roadSegments[0];
        }
        
        // 生成障碍物
        function spawnObstacle() {
            const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            game.obstacles.push({
                z: game.playerZ + 1000 + Math.random() * 500,
                lane: Math.floor(Math.random() * LANE_COUNT),
                ...type
            });
        }
        
        // 生成金币
        function spawnCoin() {
            game.coinItems.push({
                z: game.playerZ + 800 + Math.random() * 500,
                lane: Math.floor(Math.random() * LANE_COUNT)
            });
        }
        
        // 生成装饰
        function spawnDecoration() {
            const side = Math.random() > 0.5 ? 'left' : 'right';
            const imgIndex = Math.floor(Math.random() * game.decorationImages.length);
            
            game.decorations.push({
                z: game.playerZ + 500 + Math.random() * 500,
                side: side,
                imgIndex: imgIndex,
                offsetX: (Math.random() - 0.5) * 100
            });
        }
        
        // 游戏结束
        function gameOver() {
            game.running = false;
            
            if (game.score > game.bestScore) {
                game.bestScore = game.score;
                localStorage.setItem('sanguo3d_best', game.bestScore);
            }
            
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('bestScore').textContent = `最高纪录: ${game.bestScore}米`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }
        
        // 更新HUD
        function updateHUD() {
            document.getElementById('scoreHud').textContent = `🏃 ${game.score}米`;
            document.getElementById('coinHud').textContent = `🪙 ${game.coins}`;
        }
        
        // 渲染
        function render() {
            const ctx = game.ctx;
            const w = game.width;
            const h = game.height;
            
            // 绘制背景
            drawBackground(ctx, w, h);
            
            // 绘制道路
            drawRoad(ctx, w, h);
            
            // 绘制装饰
            drawDecorations(ctx, w, h);
            
            // 绘制金币
            drawCoins(ctx, w, h);
            
            // 绘制障碍物
            drawObstacles(ctx, w, h);
            
            // 绘制玩家
            drawPlayer(ctx, w, h);
        }
        
        // 绘制背景
        function drawBackground(ctx, w, h) {
            if (game.bgImages.length > 0) {
                const bgIndex = Math.floor(game.score / 500) % game.bgImages.length;
                const bg = game.bgImages[bgIndex];
                
                // 绘制背景图
                ctx.drawImage(bg, 0, 0, w, h);
                
                // 添加暗角效果
                const gradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
            } else {
                // 备用背景
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#1a3a2a');
                gradient.addColorStop(0.5, '#2d5a3a');
                gradient.addColorStop(1, '#1a3a2a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
            }
        }
        
        // 绘制道路
        function drawRoad(ctx, w, h) {
            const horizon = h * 0.38;
            const playerScreenY = h * 0.78;
            
            // 收集可见的道路点
            const roadPoints = [];
            
            for (let i = 0; i < game.roadSegments.length; i++) {
                const seg = game.roadSegments[i];
                const relZ = game.playerZ - seg.z;
                
                if (relZ > -ROAD_SEGMENT_LENGTH * 2 && relZ < 1500) {
                    const scale = 300 / (300 + relZ);
                    const screenY = horizon + (playerScreenY - horizon) * scale;
                    
                    const angleOffset = Math.sin((seg.angle - game.cameraOffset.angle) * Math.PI / 180) * relZ * 0.1;
                    const roadWidth = ROAD_WIDTH * scale;
                    const leftX = w/2 - roadWidth/2 + angleOffset * scale;
                    const rightX = w/2 + roadWidth/2 + angleOffset * scale;
                    
                    roadPoints.push({
                        y: screenY,
                        leftX: leftX,
                        rightX: rightX,
                        scale: scale,
                        z: seg.z
                    });
                }
            }
            
            roadPoints.sort((a, b) => b.z - a.z);
            
            // 绘制道路
            for (let i = 0; i < roadPoints.length - 1; i++) {
                const p1 = roadPoints[i];
                const p2 = roadPoints[i + 1];
                
                // 如果有道路图片，使用图片
                if (game.roadImage && p1.scale > 0.1) {
                    const gradient = ctx.createLinearGradient(0, p1.y, 0, p2.y);
                    gradient.addColorStop(0, 'rgba(90,74,58,0.9)');
                    gradient.addColorStop(1, 'rgba(58,42,26,0.95)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(p1.leftX, p1.y);
                    ctx.lineTo(p1.rightX, p1.y);
                    ctx.lineTo(p2.rightX, p2.y);
                    ctx.lineTo(p2.leftX, p2.y);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 道路边线
                    ctx.strokeStyle = 'rgba(139,115,85,0.8)';
                    ctx.lineWidth = 3 * p1.scale;
                    ctx.beginPath();
                    ctx.moveTo(p1.leftX, p1.y);
                    ctx.lineTo(p2.leftX, p2.y);
                    ctx.moveTo(p1.rightX, p1.y);
                    ctx.lineTo(p2.rightX, p2.y);
                    ctx.stroke();
                } else {
                    // 备用绘制
                    const gradient = ctx.createLinearGradient(0, p1.y, 0, p2.y);
                    gradient.addColorStop(0, '#5a4a3a');
                    gradient.addColorStop(1, '#3a2a1a');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(p1.leftX, p1.y);
                    ctx.lineTo(p1.rightX, p1.y);
                    ctx.lineTo(p2.rightX, p2.y);
                    ctx.lineTo(p2.leftX, p2.y);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }
        
        // 绘制装饰
        function drawDecorations(ctx, w, h) {
            const horizon = h * 0.38;
            const playerScreenY = h * 0.78;
            
            game.decorations.forEach(dec => {
                const relZ = game.playerZ - dec.z;
                if (relZ < 0 || relZ > 800) return;
                
                const scale = 200 / (200 + relZ);
                const screenY = horizon + (playerScreenY - horizon) * scale;
                
                let screenX;
                if (dec.side === 'left') {
                    screenX = w * 0.15 + dec.offsetX * scale + game.cameraOffset.angle * 2;
                } else {
                    screenX = w * 0.85 + dec.offsetX * scale + game.cameraOffset.angle * 2;
                }
                
                if (screenY > horizon && screenY < h && scale > 0.1) {
                    const img = game.decorationImages[dec.imgIndex];
                    if (img) {
                        const size = 80 * scale;
                        ctx.globalAlpha = Math.min(0.8, scale * 1.5);
                        ctx.drawImage(img, screenX - size/2, screenY - size/2, size, size);
                        ctx.globalAlpha = 1;
                    }
                }
            });
        }
        
        // 绘制金币
        function drawCoins(ctx, w, h) {
            const horizon = h * 0.38;
            const playerScreenY = h * 0.78;
            
            game.coinItems.forEach(coin => {
                const relZ = game.playerZ - coin.z;
                if (relZ < 0 || relZ > 800) return;
                
                const scale = 150 / (150 + relZ);
                const screenY = horizon + (playerScreenY - horizon) * scale - 30 * scale;
                
                const laneOffset = (coin.lane - 1) * 50 * scale;
                const screenX = w/2 + laneOffset + game.cameraOffset.angle * 2;
                
                if (screenY > horizon) {
                    if (game.coinImage) {
                        const size = 40 * scale;
                        ctx.drawImage(game.coinImage, screenX - size/2, screenY - size/2, size, size);
                    } else {
                        // 备用emoji
                        ctx.font = `${30 * scale}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🪙', screenX, screenY);
                    }
                    
                    // 光晕
                    ctx.fillStyle = 'rgba(255,215,0,0.3)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 25 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        // 绘制障碍物
        function drawObstacles(ctx, w, h) {
            const horizon = h * 0.38;
            const playerScreenY = h * 0.78;
            
            const sorted = [...game.obstacles].sort((a, b) => b.z - a.z);
            
            sorted.forEach(obs => {
                const relZ = game.playerZ - obs.z;
                if (relZ < 0 || relZ > 800) return;
                
                const scale = 150 / (150 + relZ);
                const screenY = horizon + (playerScreenY - horizon) * scale;
                
                const laneOffset = (obs.lane - 1) * 50 * scale;
                const screenX = w/2 + laneOffset + game.cameraOffset.angle * 2;
                
                if (screenY > horizon) {
                    if (game.obstacleImage) {
                        const size = 80 * scale;
                        ctx.drawImage(game.obstacleImage, screenX - size/2, screenY - size/2, size, size);
                    } else {
                        ctx.font = `${50 * scale}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🪨', screenX, screenY);
                    }
                }
            });
        }
        
        // 绘制玩家
        function drawPlayer(ctx, w, h) {
            const playerScreenX = w * 0.5;
            const playerScreenY = h * 0.75;
            const char = characters[game.character];
            
            ctx.save();
            ctx.translate(playerScreenX, playerScreenY);
            
            // 跳跃效果
            let jumpOffset = 0;
            if (game.player.jumping) {
                const elapsed = Date.now() - game.player.jumpStart;
                const progress = elapsed / JUMP_DURATION;
                jumpOffset = -Math.sin(progress * Math.PI) * 60;
            }
            
            // 滑铲效果
            let scaleX = 1, scaleY = 1;
            if (game.player.sliding) {
                scaleX = 1.3;
                scaleY = 0.5;
            }
            
            ctx.scale(scaleX, scaleY);
            
            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 20 - jumpOffset, 35, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 绘制角色图
            if (game.characterImg) {
                const size = 100;
                ctx.drawImage(game.characterImg, -size/2, -size - 30 - jumpOffset, size, size);
            } else {
                ctx.font = '80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🏃', 0, -50 - jumpOffset);
            }
            
            // 跑步特效
            ctx.font = '18px Arial';
            const bob = Math.sin(Date.now() * 0.015) * 4;
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText('💨', -25, 5 + bob);
            ctx.fillText('💨', 25, 10 - bob);
            
            ctx.restore();
        }
        
        // 启动
        init();
    </script>
</body>
</html>
